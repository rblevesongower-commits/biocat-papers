name: FeedBot
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
    inputs:
      backfill:
        description: 'One-off: post the latest N feed items (0 = normal run)'
        default: '0'
permissions:
  contents: write   # lets the bot save its list of posted items
concurrency:
  group: feedbot
jobs:
  rss-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install libraries
        run: pip install atproto feedparser beautifulsoup4 pillow requests
      - name: Post new feed items to Bluesky
        run: python bot.py
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          BACKFILL: ${{ inputs.backfill || '0' }}
      - name: Save list of posted items
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898232+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update posted items" && git push)
