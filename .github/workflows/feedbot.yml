name: FeedBot
on:
  schedule:
    - cron: '17,47 * * * *'   # every 30 minutes, off the busy :00/:30 slots
  workflow_dispatch:
permissions:
  contents: write   # lets the bot save its list of posted items
concurrency:
  group: feedbot
jobs:
  rss-to-bluesky:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install libraries
        run: pip install atproto feedparser beautifulsoup4 pillow requests
      - name: Post new feed items to Bluesky
        run: python bot.py
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
      - name: Save list of posted items
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898232+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if [ -f failed.json ]; then git add failed.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update posted items"
            git pull --rebase
            git push
          fi
